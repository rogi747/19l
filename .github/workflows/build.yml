name: LineageOS 18.1 - star2lte Full ROM / Compressed Workspace Btrfs

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Build complete ROM by default; or run compression benchmark"
        type: choice
        required: true
        default: full_rom
        options:
          - benchmark
          - full_rom
      out_storage:
        description: "Full workspace (.repo + sources + out): Btrfs ZSTD (default) or plain"
        type: choice
        required: true
        default: btrfs_zstd
        options:
          - plain
          - btrfs_zstd

permissions:
  contents: read

concurrency:
  group: los18-star2lte-rbe-full-rom-trial
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      RUN_MODE: "${{ inputs.run_mode }}"
      OUT_STORAGE: "${{ inputs.out_storage }}"

      # Android / Soong RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote"

      # The Android 11 reclient 0.25.x does not support RBE_remote_headers.
      # Forward plaintext h2c on loopback to a TLS-verified nginx gRPC proxy
      # which attaches BuildBuddy's x-buildbuddy-api-key header.
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"

      # Keep all RBE diagnostics in one place.
      RBE_log_dir: "/tmp/rbe-test"
      RBE_log_path: "text:///tmp/rbe-test/reproxy_log.txt"
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "2"

      # Proven faster in full-ROM trial; high-memory local jobs remain serialized.
      NINJA_REMOTE_NUM_JOBS: "16"
      NINJA_HIGHMEM_NUM_JOBS: "1"

      # GiB of available disk space (statvfs/df -B1, not rounded df -h).
      # Warning at 15 GiB; experimental hard stop at 7 GiB (higher risk).
      DISK_WARN_GIB: "15"
      DISK_STOP_GIB: "7"
      # Root filesystem AND Btrfs workspace are independently checked.
      # A 220 GiB sparse image is a LOGICAL size only, not extra host storage.
      BTRFS_WORKSPACE_IMAGE_GIB: "220"
      # Stop the long build early enough to upload logs and a successful ROM.
      # Whole-job limit on GitHub-hosted runners: 360 minutes.
      FULL_ROM_SOFT_DEADLINE_MINUTES: "320"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/graalvm \
            /usr/share/rust \
            /usr/share/php* || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          # Optional host runtimes unrelated to Linux Android 11 builds.
          # Do not remove /usr/bin, Python, Git, Java, Ninja, nginx or Node used by Actions.
          sudo rm -rf /usr/local/swift /opt/swift /usr/local/share/powershell \
            /opt/julia /usr/local/julia || true

          mkdir -p /home/runner/work/los /tmp/rbe-test
          # Start the total-job clock before dependency install and repo sync.
          date +%s > /tmp/rbe-test/job-start-epoch.txt

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

          # Persist a clean-runner baseline before package installation/sync.
          # No tokens or secrets are written to this log.
          TS=/tmp/rbe-test/resource-samples.tsv
          printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          printf '%s\tpost-reclaim\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used / | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            btrfs-progs \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl \
            unzip

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Ubuntu 24.04 does not ship libncurses.so.5. Android 11's old
      # RenderScript Clang (clang-3289846) still links against SONAME 5.
      # Fetch ONLY the two matching Jammy legacy runtimes, verify official
      # Ubuntu SHA-256 sums, and install without replacing system ncurses6.
      - name: Install legacy ncurses5 for Android 11 RenderScript
        shell: bash
        run: |
          set -euo pipefail

          VERSION='6.3-2ubuntu0.3'
          BASE='https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses'
          DIR='/tmp/android11-ncurses5'
          mkdir -p "$DIR" /tmp/rbe-test
          cd "$DIR"

          curl -fLSs --retry 4 --retry-delay 2 \
            "$BASE/libtinfo5_${VERSION}_amd64.deb" \
            -o "libtinfo5_${VERSION}_amd64.deb"
          curl -fLSs --retry 4 --retry-delay 2 \
            "$BASE/libncurses5_${VERSION}_amd64.deb" \
            -o "libncurses5_${VERSION}_amd64.deb"

          # Published SHA-256 checksums from packages.ubuntu.com/jammy.
          cat > SHA256SUMS <<EOF
          4df4288404108f1a156d014e8764a064e977e34e6d44931ab60451694c03c90d  libtinfo5_${VERSION}_amd64.deb
          58da01991712c6856af0658dc5e9cb533c1a6854ab950055ade185e35bc9c276  libncurses5_${VERSION}_amd64.deb
          EOF
          sha256sum -c SHA256SUMS | tee /tmp/rbe-test/legacy-ncurses-checksums.log

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            "./libtinfo5_${VERSION}_amd64.deb" \
            "./libncurses5_${VERSION}_amd64.deb"
          sudo ldconfig

          echo '=== INSTALLED LEGACY LIBRARIES ==='
          ldconfig -p | grep -E 'lib(ncurses|tinfo)\.so\.5' \
            | tee /tmp/rbe-test/legacy-ncurses-installed.log

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      # Mount BEFORE repo init/sync. Keep repo-config (checkout) on host ext4.
      # This transparently compresses .repo, prebuilts, the entire source tree,
      # and out/ without changing RBE_exec_root or Ninja paths.
      - name: Prepare Btrfs ZSTD compressed Android workspace
        if: ${{ inputs.run_mode == 'full_rom' && inputs.out_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/lineage-workspace-btrfs.img
          mkdir -p /tmp/rbe-test "$WORKSPACE"
          if mountpoint -q "$WORKSPACE" || [ -n "$(ls -A "$WORKSPACE")" ]; then
            echo '::error::Source workspace must be empty before Btrfs mount and repo init.'
            exit 1
          fi
          # Sparse backing image, NOT a real 220 GiB allocation. Never fallocate.
          truncate -s "${BTRFS_WORKSPACE_IMAGE_GIB}G" "$BACKING"
          sudo mkfs.btrfs -f -m single -d single "$BACKING" \
            > /tmp/rbe-test/workspace-btrfs-setup.log 2>&1
          sudo mount -t btrfs -o loop,compress=zstd:1,noatime \
            "$BACKING" "$WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$WORKSPACE"
          test "$(stat -f -c %T "$WORKSPACE")" = btrfs
          test "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" -gt $((DISK_STOP_GIB * 1073741824))
          {
            echo 'Btrfs ZSTD mounted on entire Android workspace before repo init.'
            echo "mount=$WORKSPACE"
            echo "backing=$BACKING"
            echo "logical_image_size_gib=$BTRFS_WORKSPACE_IMAGE_GIB"
            df -hT / "$WORKSPACE"
            echo '=== SPARSE IMAGE PHYSICAL ALLOCATION ==='
            du -h "$BACKING"
            ls -lh "$BACKING"
          } | tee /tmp/rbe-test/workspace-btrfs-setup-summary.log
          printf 'timestamp\tstage\troot_available_bytes\troot_used_bytes\tbtrfs_available_bytes\tbtrfs_used_bytes\tbacking_allocated_bytes\tbacking_apparent_bytes\n' \
            > /tmp/rbe-test/btrfs-storage-samples.tsv

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false

          # Initialize Git LFS filters BEFORE repo init/sync. WebView prebuilts
          # are stored as LFS objects, not regular git blobs.
          git lfs version
          git lfs install --skip-repo

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los
          if [ "$RUN_MODE" = full_rom ] && [ "$OUT_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Compressed workspace is not mounted'; exit 1; }
            test "$(stat -f -c %T "$PWD")" = btrfs
          fi

          repo init \
            --depth=1 \
            --git-lfs \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1

          mkdir -p .repo/local_manifests

          MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
          MANIFEST_DST=".repo/local_manifests/star2lte.xml"

          if [ ! -s "$MANIFEST_SRC" ]; then
            echo "::error::Local manifest not found or empty: $MANIFEST_SRC"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / /home/runner/work/los | tail -2
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      # The Chromium WebView APK is a Git LFS object. Without --git-lfs,
      # the source tree may contain a ~130-byte pointer instead of an APK,
      # causing veridex to fail at 99% with "Invalid file".
      - name: Fetch and validate WebView arm64 Git LFS APK
        working-directory: /home/runner/work/los
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/webview-lfs-check.log
          PULL_LOG=/tmp/rbe-test/webview-lfs-pull.log
          DIR=external/chromium-webview/prebuilt/arm64
          APK="$DIR/webview.apk"

          if [ ! -d "$DIR" ] || [ ! -f "$APK" ]; then
            echo "::error::WebView arm64 project or APK missing: $APK"
            exit 1
          fi

          echo '=== GIT LFS STATUS ===' | tee "$LOG"
          git lfs version | tee -a "$LOG"
          git -C "$DIR" lfs ls-files --long | tee -a "$LOG"
          echo '=== APK BEFORE LFS PULL ===' | tee -a "$LOG"
          stat -c 'size_bytes=%s file=%n' "$APK" | tee -a "$LOG"

          echo '=== EXPLICIT WEBVIEW LFS FETCH AND CHECKOUT ==='
          # Fetch only this APK from its own repo; do not guess a mirror URL
          # or replace it with a different WebView build.
          git -C "$DIR" lfs pull --include='webview.apk' --exclude='' \
            2>&1 | tee "$PULL_LOG"
          git -C "$DIR" lfs checkout webview.apk \
            2>&1 | tee -a "$PULL_LOG"

          echo '=== CHECK LFS POINTER AND FILE SIZE ===' | tee -a "$LOG"
          python3 - "$APK" <<'PYCHECK'
          from pathlib import Path
          import sys
          apk = Path(sys.argv[1])
          with apk.open('rb') as f:
              prefix = f.read(256)
          if prefix.startswith(b'version https://git-lfs.github.com/spec/v1'):
              sys.exit('ERROR: webview.apk is still a Git LFS pointer')
          if apk.stat().st_size < 10 * 1024 * 1024:
              sys.exit('ERROR: webview.apk is unexpectedly small (< 10 MiB)')
          if prefix[:2] != b'PK':
              sys.exit('ERROR: webview.apk does not have a ZIP/APK header')
          print(f'WebView APK size: {apk.stat().st_size:,} bytes')
          PYCHECK

          # Verify archive CRCs and manifest before starting hours of build.
          echo '=== ZIP INTEGRITY CHECK ===' | tee -a "$LOG"
          if ! unzip -tqq "$APK"; then
            echo "::error::WebView APK ZIP/CRC check failed: $APK"
            exit 1
          fi
          if ! python3 - "$APK" <<'PYZIP'
          from zipfile import ZipFile, BadZipFile
          import sys
          try:
              with ZipFile(sys.argv[1]) as archive:
                  if 'AndroidManifest.xml' not in archive.namelist():
                      raise ValueError('AndroidManifest.xml is missing')
                  print(f'WebView APK entries: {len(archive.namelist())}')
          except (BadZipFile, ValueError) as exc:
              sys.exit(f'WebView APK invalid: {exc}')
          PYZIP
          then
            echo '::error::WebView APK manifest check failed.'
            exit 1
          fi

          echo '=== VERIFIED WEBVIEW APK ===' | tee -a "$LOG"
          stat -c 'size_bytes=%s file=%n' "$APK" | tee -a "$LOG"
          sha256sum "$APK" | tee /tmp/rbe-test/webview-sha256.log | tee -a "$LOG"
          echo 'WebView arm64 LFS APK passed integrity checks.' | tee -a "$LOG"

      - name: Verify and measure compressed workspace after repo sync
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          if [ "$RUN_MODE" = full_rom ] && [ "$OUT_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs workspace mount disappeared'; exit 1; }
            test "$(stat -f -c %T "$PWD")" = btrfs
            BACKING=/tmp/lineage-workspace-btrfs.img
            {
              echo '=== COMPRESSED SOURCE TREE AFTER SYNC ==='
              df -hT / "$PWD"
              echo '=== BACKING FILE ALLOCATED BYTES ==='
              stat -c 'blocks=%b bytes_per_block=%B apparent_bytes=%s' "$BACKING"
              echo '=== BTRFS WORKSPACE USAGE ==='
              sudo btrfs filesystem usage -b "$PWD" || true
            } 2>&1 | tee /tmp/rbe-test/workspace-post-sync.log
            root_avail="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
            inner_avail="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
            if (( root_avail < DISK_STOP_GIB * 1073741824 || inner_avail < DISK_STOP_GIB * 1073741824 )); then
              echo '::error::Low disk space after sync: refusing to start Android build.'
              exit 70
            fi
            root_used="$(df -B1 --output=used / | tail -n1 | tr -d ' ')"
            inner_used="$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')"
            read -r allocated_blocks fs_block_bytes < <(stat -c '%b %B' "$BACKING")
            backing_alloc=$((allocated_blocks * fs_block_bytes))
            backing_size="$(stat -c %s "$BACKING")"
            printf '%s\tpost-repo-sync\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$root_avail" "$root_used" \
              "$inner_avail" "$inner_used" "$backing_alloc" "$backing_size" \
              >> /tmp/rbe-test/btrfs-storage-samples.tsv
          else
            echo 'Plain filesystem or benchmark mode; no full workspace Btrfs mount.'
          fi

      # Collect post-sync storage attribution while the tree is still clean.
      # This is diagnostic-only and does not mutate .repo, source, or out.
      - name: Profile storage after repo sync
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/disk-analysis.log
          TS=/tmp/rbe-test/resource-samples.tsv
          if [ ! -s "$TS" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          fi

          sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used / | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$TS"
          }
          sample post-sync

          {
            echo '=== POST-SYNC DISK ANALYSIS ==='
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo '=== MOUNT POINTS ==='
            df -hT / /mnt /home/runner/work/los
            echo '=== BLOCK DEVICES ==='
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
            echo '=== INODES ==='
            df -i /home/runner/work/los
            echo '=== GIT OBJECT STORAGE ==='
            du -sh .repo 2>/dev/null || true
            echo '=== OUTPUT TREE ==='
            du -sh out 2>/dev/null || true
            echo '=== SOURCE TREE - FIRST LEVEL ==='
            du -xhd1 . 2>/dev/null | sort -h | tail -n 50 || true
            echo '=== RUNNER SYSTEM FOOTPRINT ==='
            # Avoid scanning /home/runner/work twice (large Android checkout).
            sudo du -xhd1 /opt /usr/local /var 2>/dev/null | sort -h | tail -n 35 || true
            du -sh /home/runner/.cache /home/runner/.local /home/runner/.cargo \
              2>/dev/null || true
            echo '=== MEMORY ==='
            free -h
            echo '=== AVAILABLE DISK (BYTES) ==='
            df -B1 --output=source,size,used,avail,pcent,target /home/runner/work/los
          } 2>&1 | tee "$LOG"

          # Detail the largest checked-out prebuilts and repo metadata.
          # Diagnostic-only: never delete, prune, or mutate Android sources.
          echo '=== PREBUILTS STORAGE BREAKDOWN ==='
          if [ -d prebuilts ]; then
            du -xhd1 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-size.log || true
            du -xhd2 prebuilts 2>/dev/null | sort -h \
              > /tmp/rbe-test/prebuilts-detail.log || true
            echo '--- PREBUILTS LEVEL 1 ---'
            tail -n 60 /tmp/rbe-test/prebuilts-size.log || true
            echo '--- PREBUILTS LEVEL 2 (LARGEST 80) ---'
            tail -n 80 /tmp/rbe-test/prebuilts-detail.log || true
          else
            echo '::warning::prebuilts directory was not found.'
          fi

          echo '=== REPO METADATA STORAGE BREAKDOWN ==='
          if [ -d .repo ]; then
            du -xhd2 .repo 2>/dev/null | sort -h \
              > /tmp/rbe-test/repo-size.log || true
            echo '--- REPO METADATA (LARGEST 40) ---'
            tail -n 40 /tmp/rbe-test/repo-size.log || true
          else
            echo '::warning::.repo directory was not found.'
          fi
          # Deep-dive into the largest storage groups from previous runs.
          # Never delete source, prebuilts, .repo objects, or installed tools.
          echo '=== CLANG TOOLCHAIN VERSION BREAKDOWN ==='
          if [ -d prebuilts/clang ]; then
            du -xhd4 prebuilts/clang 2>/dev/null | sort -h \
              > /tmp/rbe-test/clang-detail.log || true
            echo '--- CLANG LARGEST 35 ---'
            tail -n 35 /tmp/rbe-test/clang-detail.log || true
            find prebuilts/clang/host -mindepth 2 -maxdepth 2 \
              -type d -name 'clang-*' -print 2>/dev/null | sort \
              > /tmp/rbe-test/clang-versions.log || true
          else
            echo '::warning::prebuilts/clang missing'
          fi

          echo '=== GRADLE PLUGIN BREAKDOWN ==='
          if [ -d prebuilts/gradle-plugin ]; then
            du -xhd4 prebuilts/gradle-plugin 2>/dev/null | sort -h \
              > /tmp/rbe-test/gradle-detail.log || true
            tail -n 25 /tmp/rbe-test/gradle-detail.log || true
          fi

          echo '=== PLATFORM GIT OBJECT BREAKDOWN ==='
          if [ -d .repo/project-objects/platform ]; then
            du -xhd4 .repo/project-objects/platform 2>/dev/null | sort -h \
              > /tmp/rbe-test/platform-objects-detail.log || true
            tail -n 35 /tmp/rbe-test/platform-objects-detail.log || true
          fi

          echo '=== MANIFEST PREBUILTS PROJECT PATHS ==='
          # A candidate inventory only: NEVER change the synced manifest.
          repo list -p 2> /tmp/rbe-test/prebuilts-projects-errors.log \
            | grep -E '^prebuilts(/|$)' \
            > /tmp/rbe-test/prebuilts-projects.log || true
          echo "Registered prebuilts projects: $(wc -l < /tmp/rbe-test/prebuilts-projects.log)"
          sed -n '1,120p' /tmp/rbe-test/prebuilts-projects.log || true
          sample post-deep-storage-profile

          echo '=== DEEP STORAGE BASELINE COMPLETE ==='

      # Fail early if Android 11's bundled RenderScript compiler cannot start.
      - name: Preflight RenderScript Clang shared libraries
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          CLANG='prebuilts/clang/host/linux-x86/clang-3289846/bin/clang.real'
          LOG='/tmp/rbe-test/renderscript-clang-ldd.log'
          test -x "$CLANG" || {
            echo "::error::RenderScript compiler not found: $CLANG"
            exit 1
          }

          echo '=== RENDERSCRIPT CLANG DYNAMIC LIBRARIES ==='
          ldd "$CLANG" 2>&1 | tee "$LOG"
          if grep -Eq 'not found|not a dynamic executable' "$LOG"; then
            echo '::error::RenderScript Clang has an unresolved runtime dependency.'
            exit 1
          fi
          echo '=== RENDERSCRIPT CLANG EXECUTION ==='
          timeout 30 "$CLANG" --version 2>&1 \
            | tee /tmp/rbe-test/renderscript-clang-version.log
          echo 'RenderScript Clang preflight passed.'

      # Android 11 Clang 11 prebuilts contain cfi_blacklist.txt, but the
      # reclient 0.57 C++ input scanner asks for cfi_ignorelist.txt when CFI
      # is enabled. Provide a byte-for-byte alias; DO NOT disable CFI.
      - name: Prepare Clang 11 CFI ignorelist compatibility
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test

          SHARE="prebuilts/clang/host/linux-x86/clang-r383902b1/lib64/clang/11.0.2/share"
          SOURCE="$SHARE/cfi_blacklist.txt"
          TARGET="$SHARE/cfi_ignorelist.txt"

          if [ ! -s "$SOURCE" ]; then
            echo "::error::Expected Android 11 Clang CFI blacklist missing: $SOURCE"
            exit 1
          fi

          if [ -e "$TARGET" ] && ! cmp -s "$SOURCE" "$TARGET"; then
            echo "::error::CFI ignorelist already exists with different contents: $TARGET"
            exit 1
          fi

          if [ ! -e "$TARGET" ]; then
            cp -- "$SOURCE" "$TARGET"
          fi

          test -s "$TARGET"
          cmp -s "$SOURCE" "$TARGET"
          {
            echo '=== CLANG 11 CFI COMPATIBILITY ==='
            echo "Source: $SOURCE"
            echo "Target: $TARGET"
            sha256sum "$SOURCE" "$TARGET"
            ls -l "$SOURCE" "$TARGET"
          } | tee /tmp/rbe-test/clang-cfi-compat.log

      - name: Verify star2lte product registration
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -eo pipefail

          echo "=== PRODUCT REGISTRATION ==="

          MATCHES="$(
            grep -R -l \
              --include='AndroidProducts.mk' \
              'lineage_starlte' \
              device vendor 2>/dev/null | head -20 || true
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::Could not find lineage_starlte in any AndroidProducts.mk."
            echo "The local manifest did not sync/register the starlte product correctly."
            find device vendor -maxdepth 4 -name AndroidProducts.mk -print 2>/dev/null | head -100 || true
            exit 1
          fi

          printf '%s\n' "$MATCHES"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "--- $file"
            sed -n '1,180p' "$file"
          done <<< "$MATCHES"

      # Pin a coherent reclient release; Android 11's original 0.25 binary
      # predates fixes for working-directory-relative remote outputs.
      - name: Install compatible reclient 0.57.0 (pinned AOSP)
        working-directory: /home/runner/work/los
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="5148d33653fe6920633e405fd990b525f5bce912"
          PINNED_VERSION="0.57.0.4865132"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          ORIGINAL="prebuilts/remoteexecution-client/live"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"

          mkdir -p "$FETCH_DIR" "$DEST" /tmp/rbe-test
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin \
            https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_VERSION}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          echo "=== FETCH PINNED RECLIENT ==="
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 \
            --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          test "$(git -C "$FETCH_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"

          # Use binaries from the SAME prebuilt release. The original
          # dependency-scanner files are retained only if not shipped by it.
          for bin in rewrapper reproxy bootstrap; do
            test -s "$FETCH_DIR/$PINNED_VERSION/$bin"
            install -m 0755 "$FETCH_DIR/$PINNED_VERSION/$bin" "$DEST/$bin"
          done
          for bin in dumpstats scandeps_server; do
            if [ -s "$FETCH_DIR/$PINNED_VERSION/$bin" ]; then
              install -m 0755 "$FETCH_DIR/$PINNED_VERSION/$bin" "$DEST/$bin"
            elif [ -x "$ORIGINAL/$bin" ]; then
              cp -L "$ORIGINAL/$bin" "$DEST/$bin"
              chmod 0755 "$DEST/$bin"
            fi
          done
          for lib in dependency_scanner_go_plugin.so; do
            if [ -f "$FETCH_DIR/$PINNED_VERSION/$lib" ]; then
              cp "$FETCH_DIR/$PINNED_VERSION/$lib" "$DEST/$lib"
            elif [ -f "$ORIGINAL/$lib" ]; then
              cp -L "$ORIGINAL/$lib" "$DEST/$lib"
            fi
          done

          printf 'pinned_commit=%s\npinned_version=%s\n' \
            "$PINNED_COMMIT" "$PINNED_VERSION" \
            > /tmp/rbe-test/reclient-version.txt
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"
          echo "=== RECLIENT VERSION ==="
          "$DEST/rewrapper" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          "$DEST/reproxy" --version 2>&1 | tee -a /tmp/rbe-test/reclient-version.txt || true
          test -x "$DEST/bootstrap"

      - name: Inspect Android reclient
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== RECLIENT DIRECTORY ==="
          ls -lah "$RBE_DIR"

          test -x "$RBE_DIR/reproxy"
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/bootstrap"

          echo "=== RBE DEPENDENCY SCANNER ==="
          if [ -f "$RBE_DIR/dependency_scanner_go_plugin.so" ]; then
            echo "dependency_scanner_go_plugin.so found."
          else
            echo "::warning::dependency_scanner_go_plugin.so not found in $RBE_DIR."
          fi
          if [ -x "$RBE_DIR/scandeps_server" ]; then
            echo "scandeps_server found."
          else
            echo "::notice::scandeps_server not found (may be absent in older reclient builds)."
          fi

          echo "=== REPROXY VERSION ==="
          "$RBE_DIR/reproxy" --version || true

          echo "=== REWRAPPER VERSION ==="
          "$RBE_DIR/rewrapper" --version || true

          echo "=== BOOTSTRAP VERSION ==="
          "$RBE_DIR/bootstrap" --version || true

      - name: Check BuildBuddy network connectivity
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -e

          echo "=== DNS ==="
          getent hosts remote.buildbuddy.io

          echo "=== TCP 443 ==="
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/remote.buildbuddy.io/443'

          echo "BuildBuddy TCP endpoint is reachable."

          echo "=== BUILD BUDDY TLS CHAIN DIAGNOSTIC ==="
          TLS_LOG="/tmp/rbe-test/buildbuddy-tls-check.log"
          mkdir -p /tmp/rbe-test
          if ! timeout 20 openssl s_client \
            -connect remote.buildbuddy.io:443 \
            -servername remote.buildbuddy.io \
            -verify_hostname remote.buildbuddy.io \
            -verify_return_error \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            </dev/null > "$TLS_LOG" 2>&1; then
            echo "::warning::OpenSSL certificate precheck returned an error; see artifact."
          fi
          grep -E 'Verification:|Verify return code:|verify error:|Verification error:|^subject=|^issuer=' "$TLS_LOG" | tail -30 || true

          echo "Authentication will be validated by the real reclient compile below."

      - name: Start authenticated BuildBuddy gRPC bridge
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail

          # This is needed for Android 11's old reclient which cannot attach
          # custom gRPC metadata. The only cleartext hop is loopback.
          BRIDGE_DIR="/tmp/buildbuddy-rbe-bridge"
          install -d -m 700 "$BRIDGE_DIR" /tmp/rbe-test
          umask 077

          # Never write the secret into workflow logs, a command argument,
          # or the uploaded /tmp/rbe-test artifact directory.
          python3 - <<'PYBRIDGE'
          import os
          from pathlib import Path

          secret = os.environ['BUILDBUDDY_API_KEY']
          if not secret or any(ch in secret for ch in ('\n', '\r', '\x00')):
              raise SystemExit('Invalid BuildBuddy API key format')

          # Escape an nginx double-quoted string safely.
          encoded = secret.replace('\\', '\\\\').replace('"', '\\"')
          config = '''worker_processes 1;
          pid /tmp/buildbuddy-rbe-bridge/nginx.pid;
          error_log /tmp/rbe-test/buildbuddy-grpc-errors.log warn;
          events { worker_connections 1024; }
          http {
            access_log off;
            client_max_body_size 0;
            server {
              listen 127.0.0.1:19099 http2;
              server_name localhost;
              location / {
                grpc_pass grpcs://remote.buildbuddy.io:443;
                grpc_ssl_server_name on;
                grpc_ssl_name remote.buildbuddy.io;
                grpc_ssl_verify on;
                # Android 11 bridge: allow intermediate CAs in the TLS chain.
                grpc_ssl_verify_depth 5;
                grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                grpc_connect_timeout 30s;
                grpc_read_timeout 300s;
                grpc_send_timeout 300s;
                grpc_set_header x-buildbuddy-api-key "__BUILDBUDDY_KEY__";
              }
            }
          }
          '''.replace('__BUILDBUDDY_KEY__', encoded)
          Path('/tmp/buildbuddy-rbe-bridge/nginx.conf').write_text(config)
          PYBRIDGE

          nginx -t -c "$BRIDGE_DIR/nginx.conf"
          nginx -c "$BRIDGE_DIR/nginx.conf"
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/19099) >/dev/null 2>&1; then
              echo "BuildBuddy local gRPC bridge is listening on 127.0.0.1:19099."
              exit 0
            fi
            sleep 1
          done
          echo "::error::BuildBuddy gRPC bridge failed to start."
          exit 1

      - name: Configure Lineage and build full star2lte ROM via BuildBuddy
        working-directory: /home/runner/work/los
        # The 320-minute job-clock guard below leaves time for cleanup/upload.
        timeout-minutes: 325
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p /tmp/rbe-test

          # LineageOS 19.1 / Android 12 uses PRODUCT-VARIANT format.
          # TARGET_RELEASE and aosp_target_release are for newer build trees.
          if [ ! -f build/envsetup.sh ]; then
            echo "::error::Missing build/envsetup.sh; check repo sync and working-directory."
            exit 1
          fi
          source build/envsetup.sh
          lunch lineage_starlte-userdebug

          # Use the checked-out JDK 11 for Android 11 host Java build stages.
          # RBE and Android Soong toolchain remain otherwise unchanged.
          if [ -x "$PWD/prebuilts/jdk/jdk11/linux-x86/bin/java" ]; then
            export JAVA_HOME="$PWD/prebuilts/jdk/jdk11/linux-x86"
            export PATH="$JAVA_HOME/bin:$PATH"
          else
            echo "::warning::Bundled JDK 11 is not present at expected path; build system will select its default JDK."
          fi
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          echo "=== JAVA VERSION ==="
          java -version 2>&1 || true

          echo "=== LINEAGE BUILD SELECTION ==="
          echo "ANDROID_BUILD_TOP=${ANDROID_BUILD_TOP:-unset}"
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-unset}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-unset}"
          echo "TARGET_BUILD_TYPE=${TARGET_BUILD_TYPE:-unset}"

          if [ -z "${ANDROID_BUILD_TOP:-}" ] || \
             [ "${TARGET_PRODUCT:-}" != "lineage_starlte" ] || \
             [ "${TARGET_BUILD_VARIANT:-}" != "userdebug" ]; then
            echo "::error::Invalid LineageOS build configuration."
            exit 1
          fi

          if [ "$(cd "$ANDROID_BUILD_TOP" && pwd -P)" != "$(pwd -P)" ]; then
            echo "::error::ANDROID_BUILD_TOP does not point at the current source tree."
            exit 1
          fi

          # Keep working_directory non-empty ("los") for BuildBuddy, while
          # upgraded reclient handles output_files relative to that directory.
          export RBE_exec_root="$(dirname "$(pwd -P)")"
          RBE_REL_WORKDIR="$(realpath --relative-to="$RBE_exec_root" "$(pwd -P)")"

          echo "=== RBE WORKING DIRECTORY COMPATIBILITY ==="
          echo "RBE_exec_root=$RBE_exec_root"
          echo "RBE_REL_WORKDIR=$RBE_REL_WORKDIR"
          if [ "$RBE_REL_WORKDIR" != "los" ]; then
            echo "::error::Unexpected RBE working directory: $RBE_REL_WORKDIR"
            exit 1
          fi
          if [ ! -d "$RBE_exec_root/$RBE_REL_WORKDIR/bionic" ]; then
            echo "::error::Android source tree is missing under RBE_exec_root."
            exit 1
          fi
          printf 'RBE_exec_root=%s\nRBE_relative_working_dir=%s\n' \
            "$RBE_exec_root" "$RBE_REL_WORKDIR" \
            > /tmp/rbe-test/rbe-working-directory.txt

          echo "=== EFFECTIVE RBE CONFIG ==="
          {
            echo "USE_RBE=${USE_RBE}"
            echo "RBE_service=${RBE_service}"
            echo "RBE_service_no_security=${RBE_service_no_security}"
            echo "RBE_DIR=${RBE_DIR}"
            echo "RBE_exec_root=${RBE_exec_root}"
            echo "RBE_relative_working_dir=${RBE_REL_WORKDIR}"
            echo "RBE_CXX_EXEC_STRATEGY=${RBE_CXX_EXEC_STRATEGY}"
            echo "RBE_use_application_default_credentials=${RBE_use_application_default_credentials}"
            echo "RBE_use_rpc_credentials=${RBE_use_rpc_credentials}"
            echo "RBE_service_no_auth=${RBE_service_no_auth}"
            echo "BuildBuddy auth=loopback nginx gRPC bridge (TLS upstream)"
            echo "RBE_log_dir=${RBE_log_dir}"
            echo "RBE_log_path=${RBE_log_path}"
            echo "RBE_proxy_log_dir=${RBE_proxy_log_dir}"
            echo "RBE_v=${RBE_v}"
            echo "RBE_output_dir=${RBE_output_dir}"
            echo "NINJA_REMOTE_NUM_JOBS=${NINJA_REMOTE_NUM_JOBS}"
          } | tee /tmp/rbe-test/rbe-env.txt

          # Write stage-specific samples for easy comparison, using bytes
          # instead of the rounded df -h values.
          DISK_SAMPLES=/tmp/rbe-test/resource-samples.tsv
          if [ ! -f "$DISK_SAMPLES" ]; then
            printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$DISK_SAMPLES"
          fi
          disk_sample() {
            local stage="$1" available used mem
            available="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
            used="$(df -B1 --output=used / | tail -n 1 | tr -d ' ')"
            mem="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$available" "$used" "$mem" >> "$DISK_SAMPLES"
            printf '%s\n' "$available"
          }
          # Separate host root from inner Btrfs. Source/out paths now reside
          # INSIDE the mount, so df "$PWD" is NOT a valid host-space check.
          BTRFS_WORKSPACE=/home/runner/work/los
          BTRFS_BACKING=/tmp/lineage-workspace-btrfs.img
          BTRFS_TSV=/tmp/rbe-test/btrfs-storage-samples.tsv
          BTRFS_ACTIVE=0
          if [ "$RUN_MODE" = full_rom ] && [ "$OUT_STORAGE" = btrfs_zstd ]; then
            if ! mountpoint -q "$BTRFS_WORKSPACE" || \
               [ "$(stat -f -c %T "$BTRFS_WORKSPACE")" != btrfs ] || \
               [ ! -f "$BTRFS_BACKING" ]; then
              echo '::error::Compressed workspace Btrfs mount or backing file is missing.'
              exit 1
            fi
            BTRFS_ACTIVE=1
            if [ ! -s "$BTRFS_TSV" ]; then
              printf 'timestamp\tstage\troot_available_bytes\troot_used_bytes\tbtrfs_available_bytes\tbtrfs_used_bytes\tbacking_allocated_bytes\tbacking_apparent_bytes\n' > "$BTRFS_TSV"
            fi
          fi

          # Fast O(1) measurements: no repeated recursive du on Android tree.
          btrfs_sample() {
            local stage="$1" root_avail root_used inner_avail inner_used backing_alloc backing_size allocated_blocks fs_block_bytes
            [ "$BTRFS_ACTIVE" -eq 1 ] || return 0
            root_avail="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
            root_used="$(df -B1 --output=used / | tail -n1 | tr -d ' ')"
            inner_avail="$(df -B1 --output=avail "$BTRFS_WORKSPACE" | tail -n1 | tr -d ' ')"
            inner_used="$(df -B1 --output=used "$BTRFS_WORKSPACE" | tail -n1 | tr -d ' ')"
            read -r allocated_blocks fs_block_bytes < <(stat -c '%b %B' "$BTRFS_BACKING")
            backing_alloc=$((allocated_blocks * fs_block_bytes))
            backing_size="$(stat -c %s "$BTRFS_BACKING")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$stage" "$root_avail" "$root_used" \
              "$inner_avail" "$inner_used" "$backing_alloc" "$backing_size" >> "$BTRFS_TSV"
            echo "BTRFS_STORAGE root_free=$((root_avail/1073741824))GiB inner_free=$((inner_avail/1073741824))GiB backing_alloc=$((backing_alloc/1048576))MiB" >> /tmp/rbe-test/resource-monitor.log
          }
          enforce_initial_disk_guard() {
            local stage="$1" available threshold inner_avail
            available="$(disk_sample "$stage")"
            threshold=$((DISK_STOP_GIB * 1024 * 1024 * 1024))
            if (( available < threshold )); then
              echo "::error::Root disk below ${DISK_STOP_GIB} GiB at ${stage}."
              df -h / "$BTRFS_WORKSPACE"
              exit 1
            fi
            if [ "$BTRFS_ACTIVE" -eq 1 ]; then
              inner_avail="$(df -B1 --output=avail "$BTRFS_WORKSPACE" | tail -n 1 | tr -d ' ')"
              if (( inner_avail < threshold )); then
                echo "::error::Btrfs workspace below ${DISK_STOP_GIB} GiB at ${stage}."
                df -h / "$BTRFS_WORKSPACE"
                exit 1
              fi
              btrfs_sample "$stage"
            fi
            echo "=== DISK AT ${stage}: $((available / 1073741824)) GiB free on host ==="
          }
          enforce_initial_disk_guard pre-graph

          echo "=== GENERATE BUILD GRAPH ==="
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log
          enforce_initial_disk_guard post-graph

          BUILD_NINJA="$ANDROID_BUILD_TOP/out/combined-${TARGET_PRODUCT}.ninja"

          if [ ! -s "$BUILD_NINJA" ]; then
            echo "::warning::Expected combined ninja was not found at: $BUILD_NINJA"
            BUILD_NINJA="$(
              find "$ANDROID_BUILD_TOP/out" \
                -maxdepth 1 \
                -type f \
                -name 'combined*.ninja' \
                -print | head -1
            )"
          fi

          if [ -z "${BUILD_NINJA:-}" ] || [ ! -s "$BUILD_NINJA" ]; then
            echo "::error::Could not locate the generated combined Ninja graph."
            find "$ANDROID_BUILD_TOP/out" -maxdepth 2 -type f -name '*.ninja' -print | head -100 || true
            exit 1
          fi

          echo "BUILD_NINJA=$BUILD_NINJA" | tee /tmp/rbe-test/build-ninja.txt

          echo "=== VERIFY REWRAPPER IS PRESENT IN GENERATED GRAPH ==="
          : > /tmp/rbe-test/rewrapper-ninja-matches.txt
          FOUND_REWRAPPER=0

          for ninja_file in \
            "$ANDROID_BUILD_TOP/out/soong/build.ninja" \
            "$BUILD_NINJA"; do
            if [ -s "$ninja_file" ]; then
              if grep -n -m 20 -E 'remoteexecution-client/.*/rewrapper|(^|[ /])rewrapper([ "]|$)' \
                "$ninja_file" \
                | tee -a /tmp/rbe-test/rewrapper-ninja-matches.txt; then
                FOUND_REWRAPPER=1
              fi
            fi
          done

          if [ "$FOUND_REWRAPPER" -ne 1 ]; then
            echo "::error::RBE is enabled, but no rewrapper command was found in the generated Ninja graph."
            echo "This means the C/C++ actions are not actually being routed through reclient."
            exit 1
          fi

          # Reclient 0.57+ understands working-directory-relative outputs.
          # No rewrapper output-directory shim is installed: the Remote
          # Execution API requires output paths relative to working_directory.
          echo "=== PINNED RECLIENT OUTPUT PATH CHECK ==="
          cat /tmp/rbe-test/reclient-version.txt
          test -x "$RBE_DIR/rewrapper"
          test -x "$RBE_DIR/reproxy"

          # Isolated storage benchmarks: .o sample, independent Btrfs mount
          # and read-only SquashFS. Benchmark mode does not mount the workspace.
          if [ "$RUN_MODE" = benchmark ]; then
            echo '=== BENCHMARK MODE: BUILD libbase SAMPLE ==='
            m -j2 libbase 2>&1 | tee /tmp/rbe-test/benchmark-libbase.log
            BENCH=/tmp/los18-storage-benchmark
            REPORT=/tmp/rbe-test/storage-benchmark-report.txt
            mkdir -p "$BENCH/objects" "$BENCH/objcopy" "$BENCH/btrfs-mount" "$BENCH/squashfs-mount"
            benchmark_cleanup() {
              if mountpoint -q "$BENCH/btrfs-mount"; then
                sudo umount "$BENCH/btrfs-mount" || true
              fi
              if mountpoint -q "$BENCH/squashfs-mount"; then
                sudo umount "$BENCH/squashfs-mount" || true
              fi
              rm -rf "$BENCH" || true
            }
            trap benchmark_cleanup EXIT
            {
              echo 'LineageOS 19.1 storage benchmarks (diagnostic only)'
              echo "RUN_MODE=$RUN_MODE"
              echo '=== BASELINE DISK ==='
              df -hT / "$PWD/out"
              echo '=== RUNNER FOOTPRINT (no deletion) ==='
              sudo du -xhd1 /usr/local /opt /var 2>/dev/null | sort -h | tail -n 35 || true
            } > "$REPORT" 2>&1
            # Collect at most 128 reasonably sized real compiler objects,
            # with a 256 MiB aggregate cap. Never mutate the original files.
            find out/soong/.intermediates -type f -name '*.o' -size +64k \
              -printf '%s\t%p\n' 2>/dev/null | sort -rn \
              > "$BENCH/object-candidates.tsv" || true
            COUNT=0
            SAMPLE_BYTES=0
            while IFS=$'\t' read -r bytes file; do
              [ -f "$file" ] || continue
              if (( COUNT >= 128 || SAMPLE_BYTES + bytes > 268435456 )); then
                continue
              fi
              COUNT=$((COUNT + 1))
              SAMPLE_BYTES=$((SAMPLE_BYTES + bytes))
              cp -- "$file" "$BENCH/objects/$(printf '%04d' "$COUNT").o"
            done < "$BENCH/object-candidates.tsv"
            echo "sample_count=$COUNT apparent_bytes=$SAMPLE_BYTES" >> "$REPORT"
            OBJCOPY='prebuilts/clang/host/linux-x86/clang-r383902b1/bin/llvm-objcopy'
            if [ ! -x "$OBJCOPY" ]; then
              OBJCOPY="$(command -v llvm-objcopy || true)"
            fi
            if [ "$COUNT" -gt 0 ] && [ -n "$OBJCOPY" ] && [ -x "$OBJCOPY" ]; then
              echo '=== DWARF zlib compression of sampled ELF objects ===' >> "$REPORT"
              OLD=0
              NEW=0
              OK=0
              for f in "$BENCH"/objects/*.o; do
                original="$(stat -c %s "$f")"
                dest="$BENCH/objcopy/$(basename "$f")"
                if "$OBJCOPY" --compress-debug-sections=zlib "$f" "$dest" \
                    >> /tmp/rbe-test/dwarf-objcopy.log 2>&1; then
                  OLD=$((OLD + original))
                  NEW=$((NEW + $(stat -c %s "$dest")))
                  OK=$((OK + 1))
                fi
              done
              echo "dwarf_compressed_objects=$OK original_bytes=$OLD compressed_bytes=$NEW" >> "$REPORT"
              if (( OLD > 0 )); then
                awk -v a="$OLD" -v b="$NEW" 'BEGIN {printf "DWARF objcopy size reduction = %.1f%%\n", 100*(a-b)/a}' >> "$REPORT"
              fi
            else
              echo 'DWARF comparison skipped: objects or llvm-objcopy missing' >> "$REPORT"
            fi
            # Compare the exact same input sample on regular ext4 and a
            # separate compression-enabled Btrfs mount, not production out/.
            if [ "$COUNT" -gt 0 ]; then
              echo '=== Btrfs ZSTD:1 sample ===' >> "$REPORT"
              BTRFS_IMG="$BENCH/btrfs-test.img"
              truncate -s 2G "$BTRFS_IMG"
              if sudo mkfs.btrfs -f -m single -d single "$BTRFS_IMG" \
                   > /tmp/rbe-test/btrfs-benchmark-setup.log 2>&1 \
                 && sudo mount -t btrfs -o loop,compress=zstd:1,noatime \
                   "$BTRFS_IMG" "$BENCH/btrfs-mount" \
                   >> /tmp/rbe-test/btrfs-benchmark-setup.log 2>&1; then
                sudo chown "$(id -u):$(id -g)" "$BENCH/btrfs-mount"
                cp -a "$BENCH/objects/." "$BENCH/btrfs-mount/"
                sync
                echo "ext4_sample_physical_bytes=$(du -sB1 "$BENCH/objects" | cut -f1)" >> "$REPORT"
                echo "btrfs_contents_physical_bytes=$(du -sB1 "$BENCH/btrfs-mount" | cut -f1)" >> "$REPORT"
                echo "btrfs_image_allocated_bytes=$(du -sB1 "$BTRFS_IMG" | cut -f1)" >> "$REPORT"
                echo "btrfs_sample_identical=$(diff -qr "$BENCH/objects" "$BENCH/btrfs-mount" >/dev/null && echo yes || echo no)" >> "$REPORT"
                sudo umount "$BENCH/btrfs-mount"
              else
                echo 'Btrfs loop mount unavailable on this runner; skipped.' >> "$REPORT"
              fi
            fi
            # SquashFS compresses a REAL compiler tree and verifies the
            # mounted compiler executes. Read-only; source checkout unchanged.
            TOOLCHAIN='prebuilts/clang/host/linux-x86/clang-r383902b1'
            if [ -d "$TOOLCHAIN" ]; then
              echo '=== SquashFS ZSTD Clang toolchain ===' >> "$REPORT"
              echo "toolchain_apparent_bytes=$(du -sb "$TOOLCHAIN" | cut -f1)" >> "$REPORT"
              SQUASH="$BENCH/clang-toolchain.sqfs"
              if mksquashfs "$TOOLCHAIN" "$SQUASH" \
                   -comp zstd -processors 2 -mem 512M -noappend \
                   > /tmp/rbe-test/squashfs-benchmark-build.log 2>&1; then
                echo "squashfs_image_bytes=$(stat -c %s "$SQUASH")" >> "$REPORT"
                if sudo mount -t squashfs -o loop,ro "$SQUASH" "$BENCH/squashfs-mount" \
                     >> /tmp/rbe-test/squashfs-benchmark-build.log 2>&1; then
                  if "$BENCH/squashfs-mount/bin/clang" --version \
                       > /tmp/rbe-test/squashfs-clang-version.log 2>&1; then
                    echo 'squashfs_clang_exec=PASS' >> "$REPORT"
                  else
                    echo 'squashfs_clang_exec=FAIL (inspect log)' >> "$REPORT"
                  fi
                  sudo umount "$BENCH/squashfs-mount"
                else
                  echo 'squashfs_mount=unavailable' >> "$REPORT"
                fi
              else
                echo 'SquashFS benchmark unsupported/failed; see log.' >> "$REPORT"
              fi
            fi
            echo '=== BENCHMARK END DISK ===' >> "$REPORT"
            df -hT / >> "$REPORT"
            cat "$REPORT"
            {
              echo '## Compression benchmark (no production changes)'
              echo '```text'
              tail -n 60 "$REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            disk_sample post-storage-benchmark >/dev/null
            echo '=== BENCHMARK COMPLETE: no full ROM build requested ==='
            exit 0
          fi

          echo "=== FULL ROM BUILD: star2lte / bacon ==="
          echo "RBE remote-only enabled; remote=16, local=3, highmem=1, no local ccache."
          echo "The previous libbase test passed; this run compiles and packages the full ROM."
          enforce_initial_disk_guard pre-build

          BUILD_LOG=/tmp/rbe-test/full-rom-build.log
          BUILD_STATUS_FILE=/tmp/rbe-test/build-exit-code.txt
          DISK_TRIP_FILE=/tmp/rbe-test/disk-stop-triggered.txt
          TIME_TRIP_FILE=/tmp/rbe-test/time-stop-triggered.txt
          rm -f "$BUILD_STATUS_FILE" "$DISK_TRIP_FILE" "$TIME_TRIP_FILE"

          if [ -s /tmp/rbe-test/job-start-epoch.txt ]; then
            JOB_START_EPOCH="$(cat /tmp/rbe-test/job-start-epoch.txt)"
          else
            JOB_START_EPOCH="$(date +%s)"
          fi
          SOFT_DEADLINE_EPOCH=$(( JOB_START_EPOCH + FULL_ROM_SOFT_DEADLINE_MINUTES * 60 ))
          echo "=== SOFT DEADLINE (UTC) ==="
          date -u -d "@$SOFT_DEADLINE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ'
          if (( $(date +%s) >= SOFT_DEADLINE_EPOCH )); then
            echo "::error::Not enough job time remains to begin full ROM build."
            exit 71
          fi

          # Run the build in a child shell and keep its exit status after tee.
          # The supervisor retains control to stop on low disk/time.
          (
            set +e
            set -o pipefail
            m -j3 bacon 2>&1 | tee "$BUILD_LOG"
            rc=${PIPESTATUS[0]}
            printf '%s\n' "$rc" > "$BUILD_STATUS_FILE"
            exit "$rc"
          ) &
          BUILD_PID=$!

          stop_process_tree() {
            local pid="$1" child
            while IFS= read -r child; do
              [ -n "$child" ] || continue
              stop_process_tree "$child"
            done < <(pgrep -P "$pid" 2>/dev/null || true)
            kill -TERM "$pid" 2>/dev/null || true
          }
          cleanup_build_supervisor() {
            if kill -0 "$BUILD_PID" 2>/dev/null; then
              stop_process_tree "$BUILD_PID"
            fi
          }
          trap cleanup_build_supervisor EXIT

          echo '=== FULL ROM DUAL STORAGE / MEMORY / TIME MONITOR (30s; 5s near disk limit) ==='
          : > /tmp/rbe-test/resource-monitor.log
          WARNED=0
          INNER_WARNED=0
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            avail="$(disk_sample full-rom-sample)"
            now="$(date +%s)"
            free_gib=$((avail / 1073741824))
            mem_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            seconds_left=$((SOFT_DEADLINE_EPOCH - now))
            inner_avail=-1
            inner_free_gib=-1
            if [ "$BTRFS_ACTIVE" -eq 1 ]; then
              if ! mountpoint -q "$BTRFS_WORKSPACE"; then
                echo 'Btrfs workspace unexpectedly unmounted; refusing to build into uncovered path' | tee "$DISK_TRIP_FILE"
                echo '::error::Btrfs workspace mount was lost.'
                stop_process_tree "$BUILD_PID"
                break
              fi
              # Independently test Btrfs inner free space (fast df).
              inner_avail="$(df -B1 --output=avail "$BTRFS_WORKSPACE" | tail -n 1 | tr -d ' ')"
              inner_free_gib=$((inner_avail / 1073741824))
            fi
            line="$(date -u +'%Y-%m-%dT%H:%M:%SZ') root_free=${free_gib}GiB btrfs_free=${inner_free_gib}GiB mem_available=${mem_kib}KiB soft_deadline_remaining=${seconds_left}s"
            echo "$line" | tee -a /tmp/rbe-test/resource-monitor.log

            if (( avail < DISK_STOP_GIB * 1073741824 )); then
              echo "Root disk safety stop: available below ${DISK_STOP_GIB} GiB" | tee "$DISK_TRIP_FILE"
              echo "::error::Host filesystem is running out of space; stopping full ROM build."
              stop_process_tree "$BUILD_PID"
              break
            fi
            if [ "$BTRFS_ACTIVE" -eq 1 ] && (( inner_avail < DISK_STOP_GIB * 1073741824 )); then
              echo "Btrfs workspace safety stop: available below ${DISK_STOP_GIB} GiB" | tee "$DISK_TRIP_FILE"
              echo "::error::Btrfs filesystem is running out of space; stopping full ROM build."
              stop_process_tree "$BUILD_PID"
              break
            fi
            if (( now >= SOFT_DEADLINE_EPOCH )); then
              echo "Time safety stop: passed ${FULL_ROM_SOFT_DEADLINE_MINUTES} minute whole-job deadline" | tee "$TIME_TRIP_FILE"
              echo "::error::Stopping build before the 6-hour GitHub job limit to preserve diagnostics."
              stop_process_tree "$BUILD_PID"
              break
            fi
            if (( avail < DISK_WARN_GIB * 1073741824 && WARNED == 0 )); then
              echo "::warning::Host filesystem is below ${DISK_WARN_GIB} GiB free."
              WARNED=1
            fi
            if [ "$BTRFS_ACTIVE" -eq 1 ] && (( inner_avail < DISK_WARN_GIB * 1073741824 && INNER_WARNED == 0 )); then
              echo "::warning::Btrfs workspace is below ${DISK_WARN_GIB} GiB free."
              INNER_WARNED=1
            fi
            if [ "$BTRFS_ACTIVE" -eq 1 ]; then
              btrfs_sample full-rom-sample
            fi
            SLEEP_TICKS=6
            if (( avail < 15 * 1073741824 )) || \
               { [ "$BTRFS_ACTIVE" -eq 1 ] && (( inner_avail < 15 * 1073741824 )); }; then
              SLEEP_TICKS=1
            fi
            for ((tick=0; tick<SLEEP_TICKS; tick++)); do
              kill -0 "$BUILD_PID" 2>/dev/null || break
              sleep 5
            done
          done

          set +e
          wait "$BUILD_PID"
          WAIT_RC=$?
          set -e
          trap - EXIT
          BUILD_RC="$WAIT_RC"
          if [ -s "$BUILD_STATUS_FILE" ]; then
            BUILD_RC="$(cat "$BUILD_STATUS_FILE")"
          fi
          if [ -s "$DISK_TRIP_FILE" ]; then BUILD_RC=70; fi
          if [ -s "$TIME_TRIP_FILE" ]; then BUILD_RC=71; fi
          disk_sample post-full-rom-build >/dev/null
          if [ "$BTRFS_ACTIVE" -eq 1 ]; then
            btrfs_sample post-full-rom-build || true
            echo '=== BTRFS STORAGE FINAL DETAIL ==='
            df -hT / "$BTRFS_WORKSPACE" || true
            sudo btrfs filesystem usage -b "$BTRFS_WORKSPACE" \
              > /tmp/rbe-test/btrfs-filesystem-usage-final.log 2>&1 || true
            cat /tmp/rbe-test/btrfs-filesystem-usage-final.log || true
          fi
          echo "=== FULL ROM BUILD EXIT: $BUILD_RC ==="

          if [ "$BUILD_RC" -ne 0 ]; then
            echo '=== BUILD ERROR LINES (LAST 120 MATCHES) ==='
            grep -anE '(^FAILED:|(^|[[:space:]])error:|No space left on device|Killed|ninja failed|out of memory|missing depfile)' "$BUILD_LOG" 2>/dev/null | tail -n 120 || true
            echo '=== FULL ROM BUILD LOG TAIL ==='
            tail -n 200 "$BUILD_LOG" 2>/dev/null || true
            echo '=== REPROXY STDERR TAIL ==='
            tail -n 100 /tmp/rbe-test/reproxy_outerr.log 2>/dev/null || true
            echo "::error::Full ROM build did not complete (exit $BUILD_RC). See attached diagnostics."
            exit "$BUILD_RC"
          fi

          # A successful Ninja exit alone is not enough: verify flashable ZIP.
          ROM_DIR="$ANDROID_BUILD_TOP/out/target/product/starlte"
          echo "=== ROM OUTPUT DIRECTORY ==="
          ls -lah "$ROM_DIR" | tail -n 45
          mapfile -d '' -t ROM_ZIPS < <(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -print0)
          if (( ${#ROM_ZIPS[@]} == 0 )); then
            echo "::error::bacon succeeded but no lineage-*.zip found in $ROM_DIR"
            exit 1
          fi
          ROM_ZIP="${ROM_ZIPS[0]}"
          if (( ${#ROM_ZIPS[@]} > 1 )); then
            ROM_ZIP="$(find "$ROM_DIR" -maxdepth 1 -type f -name 'lineage-*.zip' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -s "$ROM_ZIP"
          echo "ROM_ZIP=$ROM_ZIP"
          ls -lh "$ROM_ZIP"
          echo "=== CHECK ROM ZIP INTEGRITY ==="
          unzip -tq "$ROM_ZIP" | tail -n 8
          sha256sum "$ROM_ZIP" | tee /tmp/rbe-test/rom-sha256.txt
          basename "$ROM_ZIP" > /tmp/rbe-test/rom-filename.txt
          echo "=== FULL ROM BUILD PASSED ==="
          echo "Lineage product: ${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"
          echo 'Full bacon target completed with remote C++ compilation enabled.'

      - name: Upload completed LineageOS ROM
        if: ${{ success() && inputs.run_mode == 'full_rom' }}
        uses: actions/upload-artifact@v4
        with:
          name: lineage-19.1-starlte-${{ github.run_id }}
          path: /home/runner/work/los/out/target/product/starlte/lineage-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summarize storage measurements
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rbe-test
          FILE=/tmp/rbe-test/resource-samples.tsv
          {
            echo '## LineageOS 19.1 RBE / storage experimental trial — disk and RAM'
            echo "Mode: ${RUN_MODE}, output storage: ${OUT_STORAGE}"
            echo ''
            echo '| Stage (UTC) | Free GiB | Used GiB | RAM available GiB |'
            echo '|---|---:|---:|---:|'
            if [ -s "$FILE" ]; then
              # Show first/last rows and build low-watermark; no expensive du.
              awk -F '\t' 'NR>1 && NF>=5 {
                free=$3/1073741824; used=$4/1073741824; ram=$5/1048576;
                if (!seen || free<min) {min=free; low=$2 " " $1};
                if ($2!="build-sample" && $2!="full-rom-sample") printf "| %s: %s | %.1f | %.1f | %.1f |\n",$2,$1,free,used,ram;
                seen=1
              } END {
                if(seen) printf "\nLowest observed free disk: **%.1f GiB** at %s.\n",min,low;
                else print "No storage samples recorded."
              }' "$FILE"
            else
              echo '| No measurements | — | — | — |'
            fi
            echo ''
            echo "Disk guard: warning under ${DISK_WARN_GIB} GiB; safe stop under ${DISK_STOP_GIB} GiB (host and Btrfs independently)."
            if [ -s /tmp/rbe-test/btrfs-storage-samples.tsv ]; then
              echo ''
              echo '### Btrfs ZSTD: entire Android workspace (root vs inner filesystem)'
              echo '| Point | Host free GiB | Btrfs free GiB | Backing allocated GiB |'
              echo '|---|---:|---:|---:|'
              awk -F '\t' 'NR>1 && NF>=8 {
                count++;
                if (count==1) first=$0;
                last=$0;
                if (count%20==0) extras[count]=$0;
              } END {
                if (count>0) {
                  n=split(first,f,"\t"); printf "| %s | %.2f | %.2f | %.2f |\n", f[2],f[3]/1073741824,f[5]/1073741824,f[7]/1073741824;
                  if (count>1) {split(last,l,"\t"); printf "| %s | %.2f | %.2f | %.2f |\n",l[2],l[3]/1073741824,l[5]/1073741824,l[7]/1073741824;}
                }
              }' /tmp/rbe-test/btrfs-storage-samples.tsv
              echo ''
              echo 'Backing allocated size counts actual blocks on ext4; Btrfs used reports compressed data and metadata for .repo + source + out. No recursive scans during build.'
            fi
            if [ -s /tmp/rbe-test/disk-stop-triggered.txt ]; then
              echo '**Guard triggered: build terminated due to low disk.**'
            fi
            echo ''
            echo '### Prebuilts: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/prebuilts-size.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/prebuilts-size.log
              echo '```'
            else
              echo 'No prebuilts breakdown was captured.'
            fi
            echo ''
            echo '### Git repo metadata: largest directories (post-sync)'
            if [ -s /tmp/rbe-test/repo-size.log ]; then
              echo '```text'
              tail -n 12 /tmp/rbe-test/repo-size.log
              echo '```'
            else
              echo 'No .repo breakdown was captured.'
            fi
            echo ''
            echo '### Clang toolchains: largest paths'
            if [ -s /tmp/rbe-test/clang-detail.log ]; then
              echo '```text'
              tail -n 18 /tmp/rbe-test/clang-detail.log
              echo '```'
            else
              echo 'No Clang deep profile was captured.'
            fi
            echo ''
            echo '### Gradle plugin: largest paths'
            if [ -s /tmp/rbe-test/gradle-detail.log ]; then
              echo '```text'
              tail -n 10 /tmp/rbe-test/gradle-detail.log
              echo '```'
            else
              echo 'No Gradle deep profile was captured.'
            fi
            echo ''
            echo '### Platform Git objects: largest paths'
            if [ -s /tmp/rbe-test/platform-objects-detail.log ]; then
              echo '```text'
              tail -n 16 /tmp/rbe-test/platform-objects-detail.log
              echo '```'
            else
              echo 'No platform Git-object deep profile was captured.'
            fi
            echo ''
            if [ -s /tmp/rbe-test/prebuilts-projects.log ]; then
              echo "Prebuilts projects listed in manifest: **$(wc -l < /tmp/rbe-test/prebuilts-projects.log)**."
            else
              echo 'No prebuilts manifest project list was captured.'
            fi
            echo 'Storage profiling did not modify source or Git objects.'
            echo ''
            echo '### ROM output'
            if [ -s /tmp/rbe-test/rom-filename.txt ]; then
              echo "ROM ZIP: **$(cat /tmp/rbe-test/rom-filename.txt)**"
              echo ''
              echo '```text'
              cat /tmp/rbe-test/rom-sha256.txt 2>/dev/null || true
              echo '```'
            else
              echo 'No verified ROM ZIP created in this run.'
            fi
            if [ -s /tmp/rbe-test/time-stop-triggered.txt ]; then
              echo '**Soft job deadline triggered; build stopped to retain diagnostics.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo '=== FINAL DISK AND MEMORY ==='
          df -h / /home/runner/work/los || true
          free -h || true

          echo '=== POST-BUILD STORAGE (BOUNDED FINAL SCAN) ==='
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            df -hT / /home/runner/work/los || true
            if mountpoint -q /home/runner/work/los; then
              sudo btrfs filesystem usage -b /home/runner/work/los || true
              stat -c 'image apparent_bytes=%s allocated_blocks=%b block_bytes=%B' /tmp/lineage-workspace-btrfs.img || true
            fi
            # Only ONE best-effort full scan after the build. Skip if host is
            # close to its safety limit; never delay artifact upload for du.
            host_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
            if (( host_free > 9 * 1073741824 )); then
              timeout --kill-after=5s 75s nice -n 15 ionice -c 3 \
                du -sh /home/runner/work/los/.repo /home/runner/work/los/out \
                2>/dev/null || echo 'Final du skipped/timed out'
            else
              echo 'Final recursive scan skipped: root free under 9 GiB'
            fi
          } 2>&1 | tee /tmp/rbe-test/disk-analysis-post-build.log

      - name: RBE diagnostics
        if: always()
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set +e

          mkdir -p /tmp/rbe-test

          echo "=== SAFE RBE ENV ==="
          cat /tmp/rbe-test/rbe-env.txt 2>/dev/null || true

          echo "=== RBE LOG DIRECTORY ==="
          find /tmp/rbe-test \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort || true

          echo "=== REPROXY PROCESSES ==="
          ps aux | grep -E '[r]eproxy|[r]ewrapper|[s]candeps' || true

          echo "=== DISK ==="
          df -h / /home/runner/work/los || true
          echo "=== STORAGE PROFILE SAMPLING ==="
          tail -n 30 /tmp/rbe-test/resource-samples.tsv 2>/dev/null || true
          echo "=== RESOURCE MONITOR ==="
          tail -n 60 /tmp/rbe-test/resource-monitor.log 2>/dev/null || true
          echo '=== BTRFS DUAL STORAGE (LAST 25 SAMPLES) ==='
          tail -n 25 /tmp/rbe-test/btrfs-storage-samples.tsv 2>/dev/null || true
          echo '=== BTRFS LOGICAL SCAN WARNINGS ==='
          echo 'Recursive size scans disabled during build for performance.' 
          echo '=== BTRFS FILESYSTEM USAGE ==='
          cat /tmp/rbe-test/btrfs-filesystem-usage-final.log 2>/dev/null || true
          echo '=== SPARSE BACKING ALLOCATION ==='
          du -h /tmp/lineage-workspace-btrfs.img 2>/dev/null || true

          echo '=== PREBUILTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/prebuilts-detail.log 2>/dev/null || true
          echo '=== REPO METADATA LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/repo-size.log 2>/dev/null || true
          echo '=== CLANG TOOLCHAINS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/clang-detail.log 2>/dev/null || true
          echo '=== GRADLE PLUGIN LARGEST DIRECTORIES ==='
          tail -n 15 /tmp/rbe-test/gradle-detail.log 2>/dev/null || true
          echo '=== PLATFORM GIT OBJECTS LARGEST DIRECTORIES ==='
          tail -n 25 /tmp/rbe-test/platform-objects-detail.log 2>/dev/null || true
          echo '=== PREBUILTS MANIFEST PROJECT COUNT ==='
          wc -l /tmp/rbe-test/prebuilts-projects.log 2>/dev/null || true

          echo "=== REPROXY LOG TAIL ==="
          tail -n 220 /tmp/rbe-test/reproxy_log.txt 2>/dev/null || true

          echo "=== ALL AVAILABLE RECLIENT LOGS ==="
          find /tmp/rbe-test -maxdepth 3 -type f \
            \( -iname '*log*' -o -name '*.rpl' -o -iname '*metrics*' \) \
            -printf '%p %s bytes\n' | sort || true

          echo "=== RBE ERROR SUMMARY ==="
          grep -aRinE \
            'UNAUTHENTICATED|PERMISSION_DENIED|PermissionDenied|Unauthenticated|Unavailable|DeadlineExceeded|InvalidArgument|working_directory|input root|ResourceExhausted|ERROR|FATAL|failed|connection refused|no such file|exec format error' \
            /tmp/rbe-test \
            --exclude=full-rom-build.log \
            --exclude=m-nothing.log \
            2>/dev/null | head -100 || true

          echo "=== RBE METRICS ==="
          cat /tmp/rbe-test/rbe_metrics.txt 2>/dev/null || true

          echo "=== BUILD GRAPH LOG TAIL ==="
          tail -n 160 /tmp/rbe-test/m-nothing.log 2>/dev/null || true

          echo "=== WEBVIEW LFS PREFLIGHT ==="
          cat /tmp/rbe-test/webview-lfs-check.log 2>/dev/null || true
          cat /tmp/rbe-test/webview-sha256.log 2>/dev/null || true

          echo "=== FULL ROM BUILD LOG TAIL ==="
          tail -n 260 /tmp/rbe-test/full-rom-build.log 2>/dev/null || true
          echo "=== BUILD STOP REASONS ==="
          cat /tmp/rbe-test/*-stop-triggered.txt 2>/dev/null || true
          echo "=== ROM ZIP FILES IF PRESENT ==="
          find /home/runner/work/los/out/target/product/starlte -maxdepth 1 \
            -type f -name 'lineage-*.zip' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Stop BuildBuddy gRPC bridge and remove credentials
        if: always()
        shell: bash
        run: |
          set +e
          CFG="/tmp/buildbuddy-rbe-bridge/nginx.conf"
          if [ -f "$CFG" ]; then
            nginx -s quit -c "$CFG" >/dev/null 2>&1 || true
          fi
          rm -rf /tmp/buildbuddy-rbe-bridge
          echo "BuildBuddy bridge configuration removed."

      - name: Redact BuildBuddy API key from RBE artifacts
        if: always()
        shell: bash
        run: |
          set -e
          python3 - <<'PYREDACT'
          import os
          from pathlib import Path

          key = os.environ.get("BUILDBUDDY_API_KEY", "").encode()
          root = Path("/tmp/rbe-test")
          if key and root.is_dir():
              for file in root.rglob("*"):
                  if not file.is_file() or file.is_symlink():
                      continue
                  data = file.read_bytes()
                  if key in data:
                      # Preserve file length for binary diagnostic formats.
                      file.write_bytes(data.replace(key, b"*" * len(key)))
                      print(f"Redacted secret from: {file.relative_to(root)}")
          PYREDACT

      - name: Upload full ROM trial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbe-test-logs-${{ github.run_id }}
          path: |
            /tmp/rbe-test
            /home/runner/work/los/.repo/repo.log
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup compressed workspace Btrfs mount
        if: ${{ always() && inputs.run_mode == 'full_rom' && inputs.out_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work
        shell: bash
        run: |
          set +e
          WORKSPACE=/home/runner/work/los
          IMG=/tmp/lineage-workspace-btrfs.img
          echo '=== FINAL COMPRESSED WORKSPACE STATUS ==='
          df -hT / "$WORKSPACE" || true
          if mountpoint -q "$WORKSPACE"; then
            # Upload of ROM and diagnostics must finish BEFORE unmounting.
            sync
            sudo umount "$WORKSPACE" || echo '::warning::Failed to unmount compressed Android workspace'
          fi
          if ! mountpoint -q "$WORKSPACE"; then
            rm -f "$IMG"
          fi
          df -h / || true
